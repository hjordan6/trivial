services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trivial
      POSTGRES_PASSWORD: trivial
      POSTGRES_DB: trivial
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivial"]
      interval: 2s
      timeout: 3s
      retries: 30

  testdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trivial
      POSTGRES_PASSWORD: trivial
      POSTGRES_DB: trivial_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivial"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
